<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f5f2;color:#1d1d1f;font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.box{width:min(360px,92vw);background:#fff;border:1px solid #e6e4df;border-radius:14px;padding:22px 20px}
h1{font-size:17px;margin:0 0 14px}
label{display:block;font-size:13px;color:#6b6b70;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #e6e4df;border-radius:9px;font:inherit}
button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:9px;background:#2f6f4f;color:#fff;font:inherit;cursor:pointer}
.msg{margin-top:12px;font-size:13px;color:#b3261e;min-height:1em}
.wait{color:#6b6b70;text-align:center}
</style>
</head>
<body>
<div class="box" id="box"><div class="wait">불러오는 중…</div></div>
<script>
(() => {   // 불러온 화면과 이름이 겹치지 않도록 전부 이 안에 둠
"use strict";
// 공개 페이지: 내용은 없고, 입력한 토큰으로 비공개 저장소의 panel/index.html 을 불러와 띄웁니다.
const KEY = "dash.conn";
const get = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function form(msg) {
  const c = get() || {};
  document.getElementById("box").innerHTML = `
    <h1>로그인</h1>
    <label>계정</label><input id="o" value="${esc(c.owner)}" autocomplete="username">
    <label>저장소</label><input id="r" value="${esc(c.repo)}">
    <label>토큰</label><input id="t" type="password" value="${esc(c.token)}" autocomplete="current-password">
    <button id="go">열기</button><div class="msg" id="m">${esc(msg || "")}</div>`;
  document.getElementById("go").onclick = () => {
    const $ = id => document.getElementById(id);
    const v = { owner: $("o").value.trim(), repo: $("r").value.trim(), token: $("t").value.trim() };
    if (!v.owner || !v.repo || !v.token) { $("m").textContent = "세 칸을 모두 입력해 주세요"; return; }
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
    open_();
  };
}

async function open_() {
  const c = get();
  if (!c) return form();
  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/panel/index.html?t=${Date.now()}`, {
      cache: "no-store",
      headers: { Accept: "application/vnd.github.raw", Authorization: `Bearer ${c.token}`, "X-GitHub-Api-Version": "2022-11-28" },
    });
    if (res.status === 401) return form("토큰이 맞지 않거나 만료되었습니다");
    if (res.status === 404) return form("저장소나 파일을 찾을 수 없습니다 (이름·권한 확인)");
    if (!res.ok) return form(`불러오기 실패 (${res.status})`);
    const html = await res.text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    form("인터넷 연결을 확인해 주세요");
  }
}
open_();
})();
</script>
</body>
</html>
